# Binds the APIServer TLS profile read permissions to the controller's ServiceAccount in
# Hosted mode.

{{- if and (eq .Values.installMode "Hosted") (eq .Values.hostingKubernetesDistribution "OpenShift") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ocm-{{ .Release.Namespace }}:{{ include "controller.tlsapiserverrolename" . }}
  labels:
    app: {{ include "controller.fullname" . }}
    chart: {{ include "controller.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    addon.open-cluster-management.io/hosted-manifest-location: hosting
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-cluster-management:{{ include "controller.tlsapiserverrolename" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
